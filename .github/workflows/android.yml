name: Build Android APK

# Builds a debug APK of ScoreSquad and publishes it as a downloadable
# GitHub Release asset. GitHub-hosted runners have the Android SDK and full
# network access (Google Maven / dl.google.com), which the dev sandbox lacks.

on:
  push:
    branches: [ "claude/mobile-app-spec-DbDqA" ]
    paths-ignore: [ "README.md", "**/*.md" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build self-contained web bundle (www/)
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ScoreSquad-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoreSquad-debug-apk
          path: ScoreSquad-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ScoreSquad APK · build ${{ github.run_number }}
          body: |
            Debug APK built automatically from `${{ github.sha }}`.

            **Install:** download `ScoreSquad-debug.apk` below, enable "install from unknown sources", and open it on your Android device.
          files: ScoreSquad-debug.apk
          make_latest: true
